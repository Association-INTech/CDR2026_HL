[project]
name = "cdr2026-hl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "py-trees>=2.4.0",
    "pygame>=2.6.1",
    "pyserial>=3.5",
    "serial>=0.0.97",
]

[project.optional-dependencies]
hardware = ["RPi.GPIO>=0.7.0"]
can = ["can-isotp>=2.0.7", "python-can>=4.6.1"]
sensors = ["hokuyolx>=0.9.0", "opencv-python>=4.13.0.92", "picamera2>=0.3.0"]
all = ["RPi.GPIO>=0.7.0", "can-isotp>=2.0.7", "python-can>=4.6.1", "hokuyolx>=0.9.0", "opencv-python>=4.13.0.92", "picamera2>=0.3.0"]
